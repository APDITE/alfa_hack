# Prometheus for the credit pipeline (optional): make monitoring, then http://localhost:9090
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: credit-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
