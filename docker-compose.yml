name: alfa-hack

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host: a local Postgres on 5432 would block `make up`.
    # For running the backend outside Docker: docker compose -f docker-compose.yml -f compose.dev.yml up db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10

  mocks:
    build:
      context: ./mocks

  backend:
    build:
      context: ./backend
      target: dev
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DOCS_ENABLED: "true"
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      # Registration looks the company up in the registry mock (scenario 12).
      MOCKS_URL: http://mocks:8000
      SCORING_URL: http://scoring:8000
    volumes:
      - ./backend/app:/app/app
      - ./backend/config:/app/config
      - ./backend/migrations:/app/migrations
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Healthy once migrations and seed are done and the API answers.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker:
    build:
      context: ./backend
      target: dev
    command: ["python", "-m", "app.worker"]
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:-app}@db:5432/${POSTGRES_DB:-app}
      MOCKS_URL: http://mocks:8000
      SCORING_URL: http://scoring:8000
    volumes:
      - ./backend/app:/app/app
      - ./backend/config:/app/config
    depends_on:
      backend:
        condition: service_healthy

  scoring:
    build:
      context: ./scoring

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
      - mocks

volumes:
  pgdata:
