name: hack-test

services:
  backend-tests:
    build:
      context: ./backend
      target: dev
    command: ["pytest", "-q"]
    environment:
      APP_ENV: test
      DOCS_ENABLED: "true"

  frontend-checks:
    build:
      context: ./frontend
      target: dev
    command: ["sh", "-c", "npm run typecheck && npm run build"]
