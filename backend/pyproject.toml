[project]
name = "app"
version = "0.1.0"
description = "Hackathon backend"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]>=0.115",
    "dishka>=1.4",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.1.5",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.fastapi]
entrypoint = "app.main.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
