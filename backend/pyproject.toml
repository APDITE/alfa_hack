[project]
name = "app"
version = "0.1.0"
description = "Hackathon backend"
requires-python = "==3.12.*"
dependencies = [
    "fastapi[standard]>=0.115",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.1.5",
    "alembic>=1.20.0",
    "psycopg[binary]>=3.3.6",
    "pyjwt>=2.15.1",
    "bcrypt>=5.0.0",
    "httpx>=0.28.1",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "."
