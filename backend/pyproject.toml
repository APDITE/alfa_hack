[project]
name = "app"
version = "0.1.0"
description = "Hackathon backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "dishka>=1.4",
    "pydantic-settings>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]

[tool.fastapi]
entrypoint = "app.main.app:app"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true
mypy_path = "src"
