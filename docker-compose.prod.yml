name: hack-prod

services:
  backend:
    build:
      context: ./backend
      target: prod
    env_file: .env
    environment:
      APP_ENV: production
      DOCS_ENABLED: "false"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: prod
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      CERTBOT_DOMAIN: ${CERTBOT_DOMAIN:?Set CERTBOT_DOMAIN in .env}
    volumes:
      - ./nginx/${NGINX_CONF:-prod.conf.template}:/etc/nginx/templates/default.conf.template:ro
      - ./letsencrypt:/etc/letsencrypt:ro
      - ./certbot:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    profiles: ["certbot"]
    env_file: .env
    volumes:
      - ./letsencrypt:/etc/letsencrypt
      - ./certbot:/var/www/certbot
