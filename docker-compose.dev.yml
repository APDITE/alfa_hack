name: hack-dev

services:
  backend:
    build:
      context: ./backend
      target: dev
    env_file: .env
    environment:
      APP_ENV: development
      DOCS_ENABLED: "true"
    volumes:
      - ./backend/src:/app/src

  frontend:
    build:
      context: ./frontend
      target: dev
    volumes:
      - ./frontend:/app
      - /app/node_modules

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
